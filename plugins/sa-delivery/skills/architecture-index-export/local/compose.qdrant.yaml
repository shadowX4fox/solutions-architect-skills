# The Qdrant engine instead of the file engine — optional, for testing what a shared server ranks: the server keeps its
# vectors in a Qdrant collection (dense + sparse) and Qdrant runs beside it. Used with compose.yaml, never alone:
#
#   docker compose -f compose.yaml -f compose.qdrant.yaml up -d
#
# publish-index.js --up adds this file when SA_INDEX_STORE=qdrant. Qdrant's image is pinned (SA_INDEX_QDRANT_TAG); its
# data lives in the qdrant volume, so a restart re-embeds nothing, and `down -v` drops it with the rest. A collection is
# made for one embedding model's dimensions: with another SA_INDEX_MODEL, drop the volume (down -v) first. Switching an
# existing local server between engines re-embeds every chunk on its next publish.
services:
  server:
    environment:
      ARCHINDEX_STORE: qdrant
      QDRANT_HOST: qdrant
    depends_on:
      qdrant:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:${SA_INDEX_QDRANT_TAG:-v1.19.2}
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      retries: 30

volumes:
  qdrant:
