# Architecture index — GitHub Actions. Copy to .github/workflows/architecture-index.yml in the architecture's repository.
# Repository variables: SA_INDEX_PROJECT_KEY, SA_INDEX_SERVER, SA_INDEX_MCP_URL (optional). Secret: SA_INDEX_TOKEN.
# Service repositories (10.13.0): variable SA_SERVICE_REPOS — owner/repo, comma- or space-separated — and secret
# SA_DISPATCH_TOKEN, which may dispatch to them: a released publish with build packs sends each `architecture-released`,
# which its ci/service/architecture-build.yml answers.
# With the architecture-lifecycle skill's ci/architecture-release.yml in the repository, phase 1 is its `index` job:
# delete the `tags` trigger below, or a release is published twice (the server answers the second with 200, unchanged).
name: Architecture index

on:
  push:
    tags: ['architecture-v*']        # phase 1: a release — chunks and ledger (path filters are not applied to tag pushes)
    branches: [main]
    paths: ['handoffs/**']           # phase 2: the regenerated kit committed — the same version with its build packs
  workflow_dispatch:
    inputs:
      draft:
        description: Publish a draft (the architecture differs from its release tag)
        type: boolean
        default: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the release tag and its tree: a bundle is released only if the architecture equals the tag's
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Export, check and publish the index bundle
        run: |
          git clone --quiet --depth 1 --branch "$SA_PLUGIN_REF" https://github.com/shadowx4fox/solutions-architect-skills.git "$RUNNER_TEMP/sa-ci"
          SA_SKILLS_DIR="$RUNNER_TEMP/sa-ci" bash "$RUNNER_TEMP/sa-ci/plugins/sa-delivery/skills/architecture-index-export/ci/publish-index.sh" .
        env:
          SA_PLUGIN_REF: v10.14.0
          SA_INDEX_PROJECT_KEY: ${{ vars.SA_INDEX_PROJECT_KEY }}
          SA_INDEX_SERVER: ${{ vars.SA_INDEX_SERVER }}
          SA_INDEX_MCP_URL: ${{ vars.SA_INDEX_MCP_URL }}
          SA_INDEX_TOKEN: ${{ secrets.SA_INDEX_TOKEN }}
          SA_INDEX_ALLOW_DRAFT: ${{ inputs.draft || 'false' }}
          SA_INDEX_ARTIFACT: ${{ runner.temp }}/out/architecture-index.tgz
      - name: Tell the service repositories
        # the build packs of a released version: a tag push carries none (phase 1), and a draft is not built from
        if: github.ref_type != 'tag' && inputs.draft != true && vars.SA_SERVICE_REPOS != ''
        env:
          GH_TOKEN: ${{ secrets.SA_DISPATCH_TOKEN }}
          REPOS: ${{ vars.SA_SERVICE_REPOS }}
          KEY: ${{ vars.SA_INDEX_PROJECT_KEY }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::SA_DISPATCH_TOKEN is not set: the service repositories are not told"; exit 0; }
          v=$(sed -n 's/.*ARCHITECTURE_VERSION: *\([0-9][0-9.]*\).*/\1/p' ARCHITECTURE.md | head -1)
          for r in $(printf '%s' "$REPOS" | tr ',' ' '); do
            if gh api "repos/$r/dispatches" -f event_type=architecture-released -f "client_payload[version]=$v" -f "client_payload[project]=$KEY" >/dev/null
            then echo "architecture-released $v → $r"; else echo "::warning::$r: the dispatch failed — the token cannot write there, or the repository does not exist"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-index
          path: ${{ runner.temp }}/out/architecture-index.tgz
          if-no-files-found: ignore   # a draft that was not published leaves no bundle
