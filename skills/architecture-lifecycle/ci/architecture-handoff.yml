# Architecture handoff — GitHub Actions. Copy to .github/workflows/architecture-handoff.yml in the architecture's repository.
# Claude regenerates the whole handoff kit from a released version and opens a pull request with it; merging that PR
# publishes the version's build packs (architecture-index.yml, phase 2). architecture-release.yml dispatches it after a
# release; run it by hand to regenerate the kit of a tag (Actions → Architecture handoff → Run workflow).
# claude-code-action runs on workflow_dispatch, never on push.
#
# The PR carries the evidence of the version: the command center (visualizations/) regenerated from the tag's documents and
# its photo-mode picture, captioned with the project, the version and the date, embedded in the PR body. Best effort — a
# failure there warns and the kit's PR opens without it.
#
# Merged without a person (10.14.0): variable SA_HANDOFF_AUTOMERGE `true` merges the kit's PR here once the kit gate and the
# drift gate (kit-drift.js — an operation, an operationId or a contract version the docs still state, dropped or moved)
# pass, then dispatches architecture-index.yml on the default branch: a merge made with GITHUB_TOKEN starts no push
# workflow, a workflow_dispatch it sends does. The default branch must accept a merge by GITHUB_TOKEN (no required review).
# Unset, or a gate blocking, the PR waits for a reviewer, and merging it publishes the build packs.
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY with anthropic_api_key below). Repository setting:
# Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Architecture handoff

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to regenerate the kit from (architecture-v<version>)
        required: true
        type: string

permissions: {}

concurrency:
  group: architecture-handoff-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SA_PLUGIN_REF: v10.21.1
  SA_PLUGIN_REPO: https://github.com/shadowx4fox/solutions-architect-skills.git

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write               # SA_HANDOFF_AUTOMERGE: dispatches architecture-index.yml after the merge
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the default branch: the kit's PR is cut from it, so it carries no other change
      - name: The architecture on the default branch is the tag's
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG"; exit 1; }
          paths=$(for p in ARCHITECTURE.md docs adr tdr; do if [ -e "$p" ]; then echo "$p"; fi; done)
          git diff --quiet "$TAG" HEAD -- $paths || { echo "the architecture moved past $TAG on this branch — release it, then regenerate the kit of the new tag"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Plugin, pinned, with its contract validators
        run: |
          git clone --quiet --depth 1 --branch "$SA_PLUGIN_REF" "$SA_PLUGIN_REPO" "$RUNNER_TEMP/sa"
          (cd "$RUNNER_TEMP/sa" && bun install --frozen-lockfile)
          echo "SA_SKILLS_DIR=$RUNNER_TEMP/sa" >> "$GITHUB_ENV"     # every sa-delivery script finds sa-skills here, pinned
      - name: Let headless Chrome start          # the kit gate renders every Mermaid fence; Ubuntu 24.04's AppArmor blocks Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Regenerate the handoff kit
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          SA_JUDGE: agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # architecture-release.yml dispatches this run with GITHUB_TOKEN: the actor is github-actions[bot], which the
          # action refuses unless named. Only that bot — never '*': the workflow starts on workflow_dispatch alone
          allowed_bots: "github-actions[bot]"
          plugin_marketplaces: ${{ env.SA_PLUGIN_REPO }}
          plugins: |
            sa-skills@shadowx4fox-solution-architect-marketplace
            sa-delivery@shadowx4fox-solution-architect-marketplace
          prompt: |
            generate dev handoff — the architecture was released as ${{ inputs.tag }}. Every container, without
            --force: a part whose payload did not change is kept and only its version row moves (handoff-prepare.js),
            so the kit's diff is the release's. Unattended: take every default, ask nothing. This is a headless run: it ends
            when your turn ends, and any sub-agent still running dies with it — dispatch every sub-agent in the
            foreground (never run_in_background) and have every result before you go on. Do not commit; leave the files
            under handoffs/. End with the kit gate's receipt.
          # Bash unrestricted: the skill composes shell lines (cd …; P=…; for …) that no Bash(<prefix> *) rule matches, and a
          # denied line in a headless run is a step skipped. The runner is ephemeral, a dispatch needs write access, and the
          # job's token can write contents and pull requests only.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Bash"
      - name: Keep Claude's transcript       # the action hides its output: turns, tools and denials are here (public on a public repository)
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: handoff-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
      - name: Open the handoff pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          AUTOMERGE: ${{ vars.SA_HANDOFF_AUTOMERGE }}
        run: |
          H="$SA_SKILLS_DIR/plugins/sa-delivery/skills/architecture-dev-handoff/scripts"
          bun "$H/kit-check.js" handoffs --no-render
          [ -n "$(git status --porcelain -- handoffs)" ] || { echo "the kit did not change"; exit 0; }
          # the regenerated kit against the committed one, before the commit: a regression blocks the merge, never the PR
          drift=0; bun "$H/kit-drift.js" . || drift=$?
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # the action pointed origin at its own token and revoked it when it finished
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # what a person reads — commits, the pull request, its comment — in the architecture's language (DOC_LANGUAGE)
          t() { bun "$SA_SKILLS_DIR/scripts/shared/ci-text.js" "$@" --project .; }
          git switch -c "handoff/$TAG"
          git add handoffs && git commit -q -m "$(t handoff_commit tag="$TAG")"
          # the evidence: the command center of this version and its photo-mode pictures (no institution pack on the runner) —
          # one per component the release changed, on the plan page of its floor with it selected (10.21.0): a component changed
          # when its payload_hash in the kit's manifest moved (the hash leaves out the version stamps); at most three. A release
          # that changed no component: the whole model, as before
          V="$SA_SKILLS_DIR/plugins/sa-visualization/skills/architecture-command-center/scripts"
          lang=$(sed -n 's/.*DOC_LANGUAGE: *\([a-z][a-z]\).*/\1/p' ARCHITECTURE.md | head -n 1)
          scene=visualizations/architecture-command-center.scene.json view=visualizations/architecture-command-center.html
          changed=$(jq -n -r --argjson a "$(git show HEAD~1:handoffs/.manifest.json 2>/dev/null || echo '{}')" --argjson b "$(cat handoffs/.manifest.json 2>/dev/null || echo '{}')" \
            '($a.cut_sheets // {}) as $o | ($b.cut_sheets // {}) | to_entries[] | select(.value.payload_hash != $o[.key].payload_hash) | .key' | head -n 3)
          shots=() captions=()
          if bun "$V/scene-from-docs.js" . && bun "$V/dossier.js" . "$scene" --write \
             && bun "$V/render.js" "$scene" "$view" --lang "${lang:-en}"; then
            if [ -n "$changed" ]; then
              for c in $changed; do f="visualizations/evidence/$TAG-$c.png"; cap=$(bun "$V/snapshot.js" "$view" "$f" --plan "$c") && { shots+=("$f"); captions+=("$cap"); }; done
            else
              f="visualizations/evidence/$TAG.png"; cap=$(bun "$V/snapshot.js" "$view" "$f") && { shots+=("$f"); captions+=("$cap"); }
            fi
          fi
          if [ ${#shots[@]} -gt 0 ]; then
            git add visualizations && git commit -q -m "$(t evidence_commit tag="$TAG")"
          else
            echo "::warning::the command-center evidence was not produced"; git checkout -q -- visualizations 2>/dev/null || true; git clean -fdq visualizations
          fi
          git push -u origin "handoff/$TAG"
          body=$(t handoff_body tag="$TAG")
          for i in "${!shots[@]}"; do
            body="$body"$'\n\n'"![${captions[$i]}](https://github.com/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/${shots[$i]}?raw=true)"$'\n\n'"*${captions[$i]}*"
          done
          [ ${#shots[@]} -gt 0 ] && body="$body — $(t evidence_opens)"
          url=$(gh pr create --base main --head "handoff/$TAG" --title "$(t handoff_title tag="$TAG")" --body "$body")
          echo "$url"
          if [ "$AUTOMERGE" = "true" ] && [ "$drift" -eq 0 ]; then
            gh pr merge "$url" --squash --delete-branch
            # the merge was GITHUB_TOKEN's, so no push workflow runs: phase 2 of the index is dispatched here
            if gh workflow run architecture-index.yml -R "$GITHUB_REPOSITORY" --ref main -f draft=false; then echo "merged; architecture-index.yml dispatched"
            else echo "::warning::merged, but architecture-index.yml could not be dispatched: run it by hand (Actions → Architecture index)"; fi
          else
            why=$([ "$drift" -ne 0 ] && echo "the drift gate blocks (kit-drift.js, exit $drift)" || echo 'SA_HANDOFF_AUTOMERGE is not true')
            echo "left open for a reviewer: $why"
            [ "$drift" -ne 0 ] && gh pr comment "$url" --body "$(t handoff_drift code="$drift")" || true
          fi
