# Architecture handoff — GitHub Actions. Copy to .github/workflows/architecture-handoff.yml in the architecture's repository.
# Claude regenerates the whole handoff kit from a released version and opens a pull request with it; merging that PR
# publishes the version's build packs (architecture-index.yml, phase 2). architecture-release.yml dispatches it after a
# release; run it by hand to regenerate the kit of a tag (Actions → Architecture handoff → Run workflow).
# claude-code-action runs on workflow_dispatch, never on push.
#
# The PR carries the evidence of the version: the command center (visualizations/) regenerated from the tag's documents and
# its photo-mode picture, captioned with the project, the version and the date, embedded in the PR body. Best effort — a
# failure there warns and the kit's PR opens without it.
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY with anthropic_api_key below). Repository setting:
# Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Architecture handoff

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to regenerate the kit from (architecture-v<version>)
        required: true
        type: string

permissions: {}

concurrency:
  group: architecture-handoff-${{ inputs.tag }}
  cancel-in-progress: false

env:
  SA_PLUGIN_REF: v10.7.2
  SA_PLUGIN_REPO: https://github.com/shadowx4fox/solutions-architect-skills.git

jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0             # the default branch: the kit's PR is cut from it, so it carries no other change
      - name: The architecture on the default branch is the tag's
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null || { echo "no tag $TAG"; exit 1; }
          paths=$(for p in ARCHITECTURE.md docs adr tdr; do if [ -e "$p" ]; then echo "$p"; fi; done)
          git diff --quiet "$TAG" HEAD -- $paths || { echo "the architecture moved past $TAG on this branch — release it, then regenerate the kit of the new tag"; exit 1; }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Plugin, pinned, with its contract validators
        run: |
          git clone --quiet --depth 1 --branch "$SA_PLUGIN_REF" "$SA_PLUGIN_REPO" "$RUNNER_TEMP/sa"
          (cd "$RUNNER_TEMP/sa" && bun install --frozen-lockfile)
          echo "SA_SKILLS_DIR=$RUNNER_TEMP/sa" >> "$GITHUB_ENV"     # every sa-delivery script finds sa-skills here, pinned
      - name: Let headless Chrome start          # the kit gate renders every Mermaid fence; Ubuntu 24.04's AppArmor blocks Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Regenerate the handoff kit
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          SA_JUDGE: agent
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # architecture-release.yml dispatches this run with GITHUB_TOKEN: the actor is github-actions[bot], which the
          # action refuses unless named. Only that bot — never '*': the workflow starts on workflow_dispatch alone
          allowed_bots: "github-actions[bot]"
          plugin_marketplaces: ${{ env.SA_PLUGIN_REPO }}
          plugins: |
            sa-skills@shadowx4fox-solution-architect-marketplace
            sa-delivery@shadowx4fox-solution-architect-marketplace
          prompt: |
            generate dev handoff — the architecture was released as ${{ inputs.tag }}. Regenerate the whole kit
            (--force) for every container, unattended: take every default, ask nothing. This is a headless run: it ends
            when your turn ends, and any sub-agent still running dies with it — dispatch every sub-agent in the
            foreground (never run_in_background) and have every result before you go on. Do not commit; leave the files
            under handoffs/. End with the kit gate's receipt.
          # Bash unrestricted: the skill composes shell lines (cd …; P=…; for …) that no Bash(<prefix> *) rule matches, and a
          # denied line in a headless run is a step skipped. The runner is ephemeral, a dispatch needs write access, and the
          # job's token can write contents and pull requests only.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Agent,Bash"
      - name: Keep Claude's transcript       # the action hides its output: turns, tools and denials are here (public on a public repository)
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: handoff-transcript
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 7
      - name: Open the handoff pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          bun "$SA_SKILLS_DIR/plugins/sa-delivery/skills/architecture-dev-handoff/scripts/kit-check.js" handoffs --no-render
          [ -n "$(git status --porcelain -- handoffs)" ] || { echo "the kit did not change"; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # the action pointed origin at its own token and revoked it when it finished
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "handoff/$TAG"
          git add handoffs && git commit -q -m "handoff: kit regenerated for $TAG"
          # the evidence: the command center of this version and its photo-mode picture (no institution pack on the runner)
          V="$SA_SKILLS_DIR/plugins/sa-visualization/skills/architecture-command-center/scripts"
          lang=$(sed -n 's/.*DOC_LANGUAGE: *\([a-z][a-z]\).*/\1/p' ARCHITECTURE.md | head -n 1)
          scene=visualizations/architecture-command-center.scene.json shot="visualizations/evidence/$TAG.png" evidence=
          if bun "$V/scene-from-docs.js" . && bun "$V/dossier.js" . "$scene" --write \
             && bun "$V/render.js" "$scene" visualizations/architecture-command-center.html --lang "${lang:-en}" \
             && caption=$(bun "$V/snapshot.js" visualizations/architecture-command-center.html "$shot"); then
            git add visualizations && git commit -q -m "evidence: command center of $TAG" && evidence=yes
          else
            echo "::warning::the command-center evidence was not produced"; git checkout -q -- visualizations 2>/dev/null || true; git clean -fdq visualizations
          fi
          git push -u origin "handoff/$TAG"
          body="Regenerated by the Architecture handoff workflow from \`$TAG\`. Merging it publishes the build packs (architecture-index.yml)."
          if [ -n "$evidence" ]; then
            body="$body"$'\n\n'"![${caption}](https://github.com/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/${shot}?raw=true)"$'\n\n'"*${caption}* — \`visualizations/architecture-command-center.html\` opens the model."
          fi
          gh pr create --base main --head "handoff/$TAG" --title "Handoff kit for $TAG" --body "$body"
